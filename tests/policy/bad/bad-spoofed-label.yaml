# Fails restrict-image-registry: a data-store label does not allow an image other than that store's own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-spoofed-label
  namespace: sv-dev
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: bad-spoofed-label }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bad-spoofed-label, app.kubernetes.io/part-of: garage }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: docker.io/library/nginx:1.29
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
