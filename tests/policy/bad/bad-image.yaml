# Fails restrict-image-registry: the image is not from ghcr.io/rclaye/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image
  namespace: sv-dev
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: bad-image }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bad-image }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: docker.io/library/nginx:1.29
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 500m, memory: 128Mi }
