# Passes: Garage's own hostPath PersistentVolume at its fixed path.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: garage-data-dev
spec:
  capacity: { storage: 20Gi }
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lab-data/garage-dev
    type: DirectoryOrCreate
