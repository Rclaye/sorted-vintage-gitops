# Dev: the app repo's build workflow (T029, T116) opens a pull request that sets newTag to the git
# SHA of the image it pushed. Replicas stay 0 until that first tag; the workflow passes
# --first-replicas 1 to scripts/set-image-tag.py, which raises them only while they are 0.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sv-dev
resources:
  - ../../base
images:
  - name: ghcr.io/rclaye/sv-listings
    newTag: ecf15f434eb1139d60ab9643de11591c92dc294b
replicas:
  - { name: listings, count: 1 }
patches:
  - target: { kind: Deployment, name: listings }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: ENV, value: dev }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI, value: "https://auth.sortedvtg.lan:8443/realms/sv-dev" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI, value: "http://keycloak-http.keycloak.svc.cluster.local/realms/sv-dev/protocol/openid-connect/certs" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: KEYCLOAK_TOKEN_URL, value: "http://keycloak-http.keycloak.svc.cluster.local/realms/sv-dev/protocol/openid-connect/token" }
