# Dev: the app repo's build workflow (T029) opens a pull request that sets newTag to the git SHA
# of the image it pushed, and it merges once the checks pass (scripts/set-image-tag.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sv-dev
resources:
  - ../../base
images:
  - name: ghcr.io/rclaye/sv-bff
    newTag: c06b578e5563ac67a83a6e7f1cc9ffb9f14c5a5a
replicas:
  - { name: bff, count: 1 }
patches:
  - target: { kind: Deployment, name: bff }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: ENV, value: dev }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: JWT_ISSUER, value: "https://auth.sortedvtg.lan:8443/realms/sv-dev" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: JWKS_URL, value: "http://keycloak-http.keycloak.svc.cluster.local/realms/sv-dev/protocol/openid-connect/certs" }
