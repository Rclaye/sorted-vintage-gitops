# Meets the T026 policies: non-root, CPU and memory requests and limits, image from ghcr.io/rclaye/.
# Notifications (T071, T072, Ticket 3.6): the consumer on notifications.orders, one email per
# event and template, SMTP to this environment's Mailpit (FR-015 to FR-017). Migrations run at
# startup under an advisory lock. No routes of its own: /healthz and /metrics only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels: { app.kubernetes.io/name: notifications }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: notifications }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notifications }
    spec:
      serviceAccountName: notifications
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notifications
          image: ghcr.io/rclaye/sv-notifications:unset # the tag is set per overlay by the build workflow
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: SERVICE_NAME, value: notifications }
            - { name: JWT_AUDIENCE, value: notifications }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring:4318" }
            # Postgres: Secret from Terraform; each overlay adds DATABASE_URL built from these two.
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: pg-notifications-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-notifications-app, key: password } }
            # RabbitMQ: Notifications' own user (messaging.yaml), generated by the Messaging
            # Topology Operator; it may only read notifications.orders.
            - name: AMQP_USER
              valueFrom: { secretKeyRef: { name: notifications-user-credentials, key: username } }
            - name: AMQP_PASSWORD
              valueFrom: { secretKeyRef: { name: notifications-user-credentials, key: password } }
            - { name: AMQP_URL, value: "amqp://$(AMQP_USER):$(AMQP_PASSWORD)@rabbitmq:5672/" }
            # Keycloak: Notifications' own client, view-users only (infra #55, gitops #62), to read
            # buyers' and sellers' addresses at send time; the token URL is set per overlay.
            - { name: KEYCLOAK_CLIENT_ID, value: notifications }
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: keycloak-clients, key: notifications } }
            - { name: LISTINGS_URL, value: "http://listings" }
            # This environment's Mailpit (platform/mailpit).
            - { name: SMTP_HOST, value: mailpit }
            - { name: SMTP_PORT, value: "1025" }
          startupProbe:
            tcpSocket: { port: http } # migrations run before the port opens
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http } # not /healthz: a database outage must not restart the pod
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
