# Dev: the app repo's build workflow (T029) opens a pull request that sets newTag to the git SHA
# of the image it pushed. Deployed in Ticket 3.7 (T074) on the image already built.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sv-dev
resources:
  - ../../base
images:
  - name: ghcr.io/rclaye/sv-notifications
    newTag: 1e45a68743e9a005ecf8bf3dad80b054547e7cf4
replicas:
  - { name: notifications, count: 1 }
patches:
  - target: { kind: Deployment, name: notifications }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: ENV, value: dev }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: JWT_ISSUER, value: "https://auth.sortedvtg.lan:8443/realms/sv-dev" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: JWKS_URL, value: "http://keycloak-http.keycloak.svc.cluster.local/realms/sv-dev/protocol/openid-connect/certs" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: KEYCLOAK_TOKEN_URL, value: "http://keycloak-http.keycloak.svc.cluster.local/realms/sv-dev/protocol/openid-connect/token" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@pg-rw.sv-dev.svc:5432/notifications?sslmode=require"
