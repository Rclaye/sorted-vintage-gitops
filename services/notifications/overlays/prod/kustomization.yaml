# Prod: changes only through a pull request that waits for approval in the GitHub Environment
# prod (prod-gate, ADR-0002). promote.yml copies the dev tag here; replicas start at 0 because no
# image has been promoted yet, and the first promotion raises them (scripts/set-image-tag.py) to:
# first-prod-replicas: 1
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sv-prod
resources:
  - ../../base
images:
  - name: ghcr.io/rclaye/sv-notifications
    newTag: 1e45a68743e9a005ecf8bf3dad80b054547e7cf4
replicas:
  - { name: notifications, count: 0 }
patches:
  - target: { kind: Deployment, name: notifications }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: ENV, value: prod }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: JWT_ISSUER, value: "https://auth.sortedvtg.lan:8443/realms/sv-prod" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: JWKS_URL, value: "http://keycloak-http.keycloak.svc.cluster.local/realms/sv-prod/protocol/openid-connect/certs" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: KEYCLOAK_TOKEN_URL, value: "http://keycloak-http.keycloak.svc.cluster.local/realms/sv-prod/protocol/openid-connect/token" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@pg-rw.sv-prod.svc:5432/notifications?sslmode=require"
