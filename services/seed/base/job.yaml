# Seed job (T051), sv-dev only: demo sellers in Keycloak linked to their Stripe test accounts, and
# 50 listings with photos. Runs after every sync of seed-dev (an Argo CD PostSync hook), so a new
# image runs it again; it only creates what is missing. Meets the T026 policies: non-root, CPU and
# memory requests and limits, image from ghcr.io/rclaye/.
# Label lab-live=true: the workstation's live pane follows its log.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  labels: { app.kubernetes.io/name: seed }
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: { app.kubernetes.io/name: seed, lab-live: "true" }
    spec:
      restartPolicy: Never
      serviceAccountName: seed
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seed
          image: ghcr.io/rclaye/sv-seed:unset # the tag is set per overlay by the build workflow
          env:
            # The seed client (T120): may only manage users; its secret comes from Terraform.
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: keycloak-clients, key: seed } }
            - { name: KEYCLOAK_URL, value: "http://keycloak-http.keycloak.svc.cluster.local" }
            - { name: PAYMENTS_URL, value: "http://payments" }
            - { name: LISTINGS_URL, value: "http://listings" }
            # The BFF as a browser reaches it; the tool sends *.sortedvtg.lan to Traefik's Service
            # and pins the lab certificate (Sprint 2 spike "In-cluster sign-in").
            - { name: TRAEFIK_HOST, value: "traefik.traefik.svc.cluster.local" }
            - { name: TLS_CERT_FILE, value: /etc/seed/tls/tls.crt }
            - { name: SELLERS_FILE, value: /etc/seed/sellers/sellers.json }
            - { name: VERIFY_DIR, value: /etc/seed/verify }
            - { name: LISTINGS_TOTAL, value: "50" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 192Mi }
          volumeMounts:
            - { name: sellers, mountPath: /etc/seed/sellers, readOnly: true }
            - { name: verify, mountPath: /etc/seed/verify, readOnly: true }
            - { name: tls, mountPath: /etc/seed/tls, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        # Terraform (infra): the sellers and their Stripe account ids, and the lab certificate.
        - name: sellers
          secret: { secretName: seed-sellers }
        # Until seed_sellers lists verify-seller, the user is created from this Secret, unlinked.
        - name: verify
          secret: { secretName: verify-seller }
        - name: tls
          configMap: { name: lab-tls-cert }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
