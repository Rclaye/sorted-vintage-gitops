# Dev only. The app repo's build workflow (T029) opens a pull request that sets newTag to the git
# SHA of the image it pushed. The seed Job is a PostSync hook, and Argo CD does not compare hooks,
# so a new tag alone leaves seed-dev Synced and the seed does not run again (found 2026-11-20).
# The replacement copies the Job's image into an annotation on the ServiceAccount, a tracked
# resource: a new tag puts seed-dev OutOfSync, auto-sync runs, and the hook runs with the new image.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sv-dev
resources:
  - ../../base
images:
  - name: ghcr.io/rclaye/sv-seed
    newTag: fa8f88a7f73c7879538bef1408f9b23d34f9b0af
replacements:
  - source:
      kind: Job
      name: seed
      fieldPath: spec.template.spec.containers.[name=seed].image
    targets:
      - select:
          kind: ServiceAccount
          name: seed
        fieldPaths:
          - metadata.annotations.[sortedvintage.lab/seed-image]
        options:
          create: true
