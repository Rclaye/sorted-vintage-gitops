# Meets the T026 policies: non-root, CPU and memory requests and limits, image from ghcr.io/rclaye/.
# Payments (T042-T045, T050): Stripe Connect onboarding, payout status, the Connect webhook and the
# 5-minute reconciliation (research R5, R17). Migrations run at startup under an advisory lock.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels: { app.kubernetes.io/name: payments }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: payments }
  template:
    metadata:
      labels: { app.kubernetes.io/name: payments }
    spec:
      serviceAccountName: payments
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: payments
          image: ghcr.io/rclaye/sv-payments:unset # the tag is set per overlay by the build workflow
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: SERVICE_NAME, value: payments }
            - { name: JWT_AUDIENCE, value: payments }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring:4318" }
            # Postgres: Secret from Terraform; each overlay adds DATABASE_URL built from these two.
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: pg-payments-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-payments-app, key: password } }
            # Stripe: this environment's sandbox key and the signing secret stripe listen uses
            # (research R3, R4), from the Terraform-created Secret stripe (T012).
            - name: STRIPE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: stripe, key: secret-key } }
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: stripe, key: webhook-secret } }
          startupProbe:
            tcpSocket: { port: http } # migrations run before the port opens
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http } # not /healthz: a database outage must not restart the pod
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
