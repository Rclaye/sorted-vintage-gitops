# Meets the T026 policies: non-root, CPU and memory requests and limits, image from ghcr.io/rclaye/.
# Orders (T061-T065, Ticket 3.4): checkout, order state, payment results, expiry and the outbox
# relay to RabbitMQ (research R8, R9). Migrations run at startup under an advisory lock.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels: { app.kubernetes.io/name: orders }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: orders }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orders }
    spec:
      serviceAccountName: orders
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: orders
          image: ghcr.io/rclaye/sv-orders:unset # the tag is set per overlay by the build workflow
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: SERVICE_NAME, value: orders }
            - { name: JWT_AUDIENCE, value: orders }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring:4318" }
            # Postgres: Secret from Terraform; each overlay adds DATABASE_URL built from these two.
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: pg-orders-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-orders-app, key: password } }
            # RabbitMQ: Orders' own user (messaging.yaml), generated by the Messaging Topology
            # Operator; it may only publish to the orders exchange.
            - name: AMQP_USER
              valueFrom: { secretKeyRef: { name: orders-user-credentials, key: username } }
            - name: AMQP_PASSWORD
              valueFrom: { secretKeyRef: { name: orders-user-credentials, key: password } }
            - { name: AMQP_URL, value: "amqp://$(AMQP_USER):$(AMQP_PASSWORD)@rabbitmq:5672/" }
            # Orders' client-credentials token for Payments and for consume/release in Listings
            # (research R8); the token URL is set per overlay.
            - { name: KEYCLOAK_CLIENT_ID, value: orders }
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: keycloak-clients, key: orders } }
            - { name: LISTINGS_URL, value: "http://listings" }
            - { name: PAYMENTS_URL, value: "http://payments" }
            # The platform fee recorded on each order (FR-013), from the generated ConfigMap, so a
            # change to it rolls the pods.
            - name: FEE_PCT
              valueFrom: { configMapKeyRef: { name: orders-settings, key: fee-pct } }
          startupProbe:
            tcpSocket: { port: http } # migrations run before the port opens
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http } # not /healthz: a database outage must not restart the pod
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
