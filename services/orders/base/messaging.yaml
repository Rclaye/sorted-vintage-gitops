# T070: the RabbitMQ topology for order events (FR-017, contracts/orders-events.asyncapi.yaml),
# as Messaging Topology Operator resources on this namespace's RabbitmqCluster "rabbitmq".
# Proven on a throwaway cluster in the Ticket 3.1 spike (sprints/sprint-3/spikes.md).
#
#   orders (topic) --order.paid, order.refunded--> notifications.orders (quorum, 6 deliveries)
#   notifications.orders --dead letters--> orders.dlx (fanout) --> notifications.orders.dead
#
# x-delivery-limit 5 allows six deliveries in all; the Notifications consumer rejects without
# requeue on its own fifth failure (T072), so the limit only catches a consumer that crashes
# mid-message. order.failed is published but bound to nothing in v1.
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: orders
spec:
  name: orders
  type: topic
  durable: true
  autoDelete: false
  rabbitmqClusterReference: { name: rabbitmq }
---
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: orders-dlx
spec:
  name: orders.dlx
  type: fanout
  durable: true
  autoDelete: false
  rabbitmqClusterReference: { name: rabbitmq }
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: notifications-orders
spec:
  name: notifications.orders
  type: quorum
  durable: true
  autoDelete: false
  arguments:
    x-delivery-limit: 5
    x-dead-letter-exchange: orders.dlx
  rabbitmqClusterReference: { name: rabbitmq }
---
apiVersion: rabbitmq.com/v1beta1
kind: Queue
metadata:
  name: notifications-orders-dead
spec:
  name: notifications.orders.dead
  type: quorum
  durable: true
  autoDelete: false
  rabbitmqClusterReference: { name: rabbitmq }
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: orders-paid-to-notifications
spec:
  source: orders
  destination: notifications.orders
  destinationType: queue
  routingKey: order.paid
  rabbitmqClusterReference: { name: rabbitmq }
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: orders-refunded-to-notifications
spec:
  source: orders
  destination: notifications.orders
  destinationType: queue
  routingKey: order.refunded
  rabbitmqClusterReference: { name: rabbitmq }
---
apiVersion: rabbitmq.com/v1beta1
kind: Binding
metadata:
  name: orders-dlx-to-dead
spec:
  source: orders.dlx
  destination: notifications.orders.dead
  destinationType: queue
  rabbitmqClusterReference: { name: rabbitmq }
---
# Ticket 3.7 (T074): Orders' own RabbitMQ user. The operator generates its name and password into
# Secret orders-user-credentials. It may publish to the orders exchange and nothing else; checked
# against RabbitMQ 4.3.4 on 2026-11-17 (a passive check of the exchange and a confirmed publish
# pass, reading notifications.orders is refused).
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: orders
  annotations:
    # Declared before its Permission and the Deployment: a Permission sent before RabbitMQ
    # has the user fails (vhost_or_user_not_found) and the operator backs off for up to 16
    # minutes (rebuild drill, 2026-11-20). Waits on Argo CD's Ready health check (infra).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  rabbitmqClusterReference: { name: rabbitmq }
---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: orders
spec:
  vhost: "/"
  userReference: { name: orders }
  permissions: { configure: "^$", write: "^orders$", read: "^$" }
  rabbitmqClusterReference: { name: rabbitmq }
