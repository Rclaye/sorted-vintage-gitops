# App images come only from the project's registry, ghcr.io/rclaye/ (T026, FR-027), where CI
# builds and scans every image. Applies to sv-dev and sv-prod only.
#
# Exclusions (each bound to a label AND the upstream image it may use, so the label alone
# lets nothing else in):
#   CloudNativePG pods and Jobs      label cnpg.io/cluster (set by the operator)
#                                    -> ghcr.io/cloudnative-pg/ (Postgres, barman-cloud sidecar)
#   RabbitMQ                         label app.kubernetes.io/part-of: rabbitmq (set by the operator)
#                                    -> rabbitmq:
#   Garage and its PostSync setup Job  label app.kubernetes.io/part-of: garage (platform/garage)
#                                    -> dxflrs/garage:, python:3.13-alpine
#   Mailpit                          label app.kubernetes.io/part-of: mailpit (platform/mailpit)
#                                    -> axllent/mailpit:
# Platform namespaces (argocd, monitoring, keycloak, the operators) are outside this policy's
# scope altogether: it only matches sv-dev and sv-prod.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registry
  annotations:
    policies.kyverno.io/title: App images only from ghcr.io/rclaye/
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [sv-dev, sv-prod]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
    - name: labels
      expression: object.metadata.?labels.orValue({})
    - name: partOf
      expression: variables.labels[?'app.kubernetes.io/part-of'].orValue('')
    - name: dataStoreImages
      expression: >-
        'cnpg.io/cluster' in variables.labels ? ['ghcr.io/cloudnative-pg/'] :
        {
          'rabbitmq': ['rabbitmq:'],
          'garage': ['dxflrs/garage:', 'python:3.13-alpine'],
          'mailpit': ['axllent/mailpit:']
        }[?variables.partOf].orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.startsWith('ghcr.io/rclaye/') ||
          variables.dataStoreImages.exists(p, c.image.startsWith(p)))
      messageExpression: >-
        'Images must come from ghcr.io/rclaye/; not allowed: ' +
        variables.containers.filter(c,
          !c.image.startsWith('ghcr.io/rclaye/') &&
          !variables.dataStoreImages.exists(p, c.image.startsWith(p))
        ).map(c, c.image).join(', ')
