# Mailpit catches every email the environment sends (T024): SMTP on 1025, web UI on 8025 under
# mail.sortedvtg.lan/<env>/. Nothing leaves the lab. Messages are kept in memory only.
# Mailpit never calls the Kubernetes API: own ServiceAccount, no token mounted (T112).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mailpit
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels: { app.kubernetes.io/name: mailpit }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mailpit }
  template:
    metadata:
      # part-of binds this pod to its upstream image in policies/restrict-image-registry.yaml.
      labels: { app.kubernetes.io/name: mailpit, app.kubernetes.io/part-of: mailpit }
    spec:
      serviceAccountName: mailpit
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.32.0
          env:
            - { name: MP_WEBROOT, value: "/ENV/" }
          ports:
            - { name: smtp, containerPort: 1025 }
            - { name: http, containerPort: 8025 }
          readinessProbe:
            httpGet: { path: /ENV/readyz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: { app.kubernetes.io/name: mailpit }
  ports:
    - { name: smtp, port: 1025, targetPort: smtp }
    - { name: http, port: 8025, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: mail.sortedvtg.lan
      http:
        paths:
          - path: /ENV
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port: { number: 8025 }
