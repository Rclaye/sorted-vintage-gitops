apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sv-prod
resources:
  - ../../base
patches:
  - target: { kind: Deployment, name: mailpit }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/env/0/value, value: "/prod/" }
      - { op: replace, path: /spec/template/spec/containers/0/readinessProbe/httpGet/path, value: "/prod/readyz" }
  - target: { kind: Ingress, name: mailpit }
    patch: |-
      - { op: replace, path: /spec/rules/0/http/paths/0/path, value: "/prod" }
