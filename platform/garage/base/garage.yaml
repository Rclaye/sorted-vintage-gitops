# Neither Garage nor its setup Job calls the Kubernetes API, so each has its own ServiceAccount
# and no API token is mounted (Constitution VI, T112).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage-setup
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  labels: { app.kubernetes.io/name: garage }
spec:
  selector: { app.kubernetes.io/name: garage }
  ports:
    - { name: s3, port: 3900, targetPort: s3 }
    - { name: admin, port: 3903, targetPort: admin }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  labels: { app.kubernetes.io/name: garage }
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: garage }
  template:
    metadata:
      # part-of binds this pod to its upstream image in policies/restrict-image-registry.yaml.
      labels: { app.kubernetes.io/name: garage, app.kubernetes.io/part-of: garage }
    spec:
      serviceAccountName: garage
      automountServiceAccountToken: false
      # No root step: the data is on Docker Desktop's virtiofs mount, which does not enforce
      # ownership, so uid 1000 creates and writes meta/ and data/ itself (infra spikes.md, T108).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: garage
          image: dxflrs/garage:v2.5.0
          args: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom: { secretKeyRef: { name: garage-admin, key: rpc-secret } }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: garage-admin, key: admin-token } }
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: admin, containerPort: 3903 }
          # /health only passes once a layout exists, and the layout is applied by the setup Job,
          # which needs this pod Ready first; so readiness is the admin port accepting connections.
          readinessProbe:
            tcpSocket: { port: admin }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/garage, readOnly: true }
            - { name: data, mountPath: /var/lib/garage }
      volumes:
        - name: config
          configMap: { name: garage-config }
        - name: data
          persistentVolumeClaim: { claimName: garage-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 20Gi }
  volumeName: garage-data-ENV
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels: { app.kubernetes.io/name: garage-setup, app.kubernetes.io/part-of: garage }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: garage-setup
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: setup
          image: python:3.13-alpine
          command: ["python3", "/setup/setup.py"]
          env:
            - { name: GARAGE_ADMIN_URL, value: "http://garage:3903" }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: garage-admin, key: admin-token } }
            - name: PHOTOS_KEY_ID
              valueFrom: { secretKeyRef: { name: s3-photos, key: ACCESS_KEY_ID } }
            - name: PHOTOS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: s3-photos, key: ACCESS_SECRET_KEY } }
            - name: BACKUPS_KEY_ID
              valueFrom: { secretKeyRef: { name: s3-backups, key: ACCESS_KEY_ID } }
            - name: BACKUPS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: s3-backups, key: ACCESS_SECRET_KEY } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          volumeMounts:
            - { name: setup, mountPath: /setup, readOnly: true }
      volumes:
        - name: setup
          configMap: { name: garage-setup }
