apiVersion: v1
kind: Service
metadata:
  name: garage
  labels: { app.kubernetes.io/name: garage }
spec:
  selector: { app.kubernetes.io/name: garage }
  ports:
    - { name: s3, port: 3900, targetPort: s3 }
    - { name: admin, port: 3903, targetPort: admin }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  labels: { app.kubernetes.io/name: garage }
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: garage }
  template:
    metadata:
      labels: { app.kubernetes.io/name: garage }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # The data lives on a host path (the Kind extraMount), which fsGroup cannot re-own.
        # This one step runs as root with only CHOWN, so Garage itself never needs root.
        - name: own-data
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /var/lib/garage/meta /var/lib/garage/data && chown -R 1000:1000 /var/lib/garage"]
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"], add: ["CHOWN"] }
          resources:
            requests: { cpu: 10m, memory: 8Mi }
            limits: { memory: 32Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/garage }
      containers:
        - name: garage
          image: dxflrs/garage:v2.5.0
          args: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom: { secretKeyRef: { name: garage-admin, key: rpc-secret } }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: garage-admin, key: admin-token } }
          ports:
            - { name: s3, containerPort: 3900 }
            - { name: rpc, containerPort: 3901 }
            - { name: admin, containerPort: 3903 }
          # /health only passes once a layout exists, and the layout is applied by the setup Job,
          # which needs this pod Ready first; so readiness is the admin port accepting connections.
          readinessProbe:
            tcpSocket: { port: admin }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/garage, readOnly: true }
            - { name: data, mountPath: /var/lib/garage }
      volumes:
        - name: config
          configMap: { name: garage-config }
        - name: data
          persistentVolumeClaim: { claimName: garage-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage-data
spec:
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 20Gi }
  volumeName: garage-data-ENV
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: setup
          image: python:3.13-alpine
          command: ["python3", "/setup/setup.py"]
          env:
            - { name: GARAGE_ADMIN_URL, value: "http://garage:3903" }
            - name: GARAGE_ADMIN_TOKEN
              valueFrom: { secretKeyRef: { name: garage-admin, key: admin-token } }
            - name: PHOTOS_KEY_ID
              valueFrom: { secretKeyRef: { name: s3-photos, key: ACCESS_KEY_ID } }
            - name: PHOTOS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: s3-photos, key: ACCESS_SECRET_KEY } }
            - name: BACKUPS_KEY_ID
              valueFrom: { secretKeyRef: { name: s3-backups, key: ACCESS_KEY_ID } }
            - name: BACKUPS_SECRET_KEY
              valueFrom: { secretKeyRef: { name: s3-backups, key: ACCESS_SECRET_KEY } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: setup, mountPath: /setup, readOnly: true }
      volumes:
        - name: setup
          configMap: { name: garage-setup }
