# Single-node Garage (infra research R19). The RPC secret and admin token come from the
# Terraform-created Secret garage-admin through GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
# The region S3 clients assume by default, so Barman and the AWS SDKs need no extra setting.
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
