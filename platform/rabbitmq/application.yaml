# RabbitMQ (T023): the cluster operator (wave 1), the topology operator (wave 2), then one
# RabbitmqCluster per environment (wave 3).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-cluster-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/Rclaye/sorted-vintage-gitops.git
    targetRevision: main
    path: platform/rabbitmq/cluster-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["ServerSideApply=true"]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-topology-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/Rclaye/sorted-vintage-gitops.git
    targetRevision: main
    path: platform/rabbitmq/topology-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq-system
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["ServerSideApply=true"]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/Rclaye/sorted-vintage-gitops.git
    targetRevision: main
    path: platform/rabbitmq/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: sv-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/Rclaye/sorted-vintage-gitops.git
    targetRevision: main
    path: platform/rabbitmq/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: sv-prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
