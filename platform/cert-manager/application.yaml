# cert-manager (T017): needed by the CloudNativePG Barman Cloud Plugin (research R10).
# Known and accepted (platform hygiene, 2026-11-12): the controller restarts every 10 to 20 minutes.
# Its liveness check includes clockHealth, which fails once the wall clock and its monotonic clock
# drift more than 5 minutes apart, as Docker Desktop's VM clock does, and stays failed until the
# process restarts. Restarting is cert-manager's intended recovery and certificates keep working,
# so the probe is left at the chart's defaults; a longer threshold would only delay each restart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        crds:
          enabled: true
        resources:
          requests: { cpu: 10m, memory: 48Mi }
          limits: { memory: 128Mi }
        webhook:
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
        cainjector:
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { memory: 128Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
