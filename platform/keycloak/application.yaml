# Keycloak (T025, research R13, R16): one instance with realms sv-dev and sv-prod, its own Postgres,
# and the browser login at auth.sortedvtg.lan. The namespace and every Secret come from Terraform.
# Realms are imported at start with --import-realm, which skips a realm that already exists, so a
# restored database is never overwritten (the IGNORE_EXISTING behaviour R16 asks for).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/Rclaye/sorted-vintage-gitops.git
    targetRevision: main
    path: platform/keycloak/db
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated: { prune: true, selfHeal: true }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  sources:
    - repoURL: https://github.com/Rclaye/sorted-vintage-gitops.git
      targetRevision: main
      path: platform/keycloak/realms
    - repoURL: https://codecentric.github.io/helm-charts
      chart: keycloakx
      targetRevision: 7.4.0
      helm:
        valuesObject:
          fullnameOverride: keycloak
          command:
            - /opt/keycloak/bin/kc.sh
            - start
            - --import-realm
            - --http-enabled=true
            - --http-port=8080
            - --health-enabled=true
            - --metrics-enabled=true
            - --cache=local
          http: { relativePath: "/" }
          proxy: { enabled: true, mode: xforwarded }
          database:
            vendor: postgres
            hostname: keycloak-db-rw.keycloak.svc.cluster.local
            port: 5432
            database: keycloak
            username: keycloak
            existingSecret: pg-keycloak-app
            existingSecretKey: password
          extraEnv: |
            - name: KC_HOSTNAME
              value: https://auth.sortedvtg.lan:8443
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
          extraEnvFrom: |
            - secretRef: { name: keycloak-realm-clients }
          extraVolumes: |
            - name: realms
              configMap: { name: keycloak-realms }
          extraVolumeMounts: |
            - name: realms
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 768Mi }
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
              traefik.ingress.kubernetes.io/router.tls: "true"
            rules:
              - host: auth.sortedvtg.lan
                paths:
                  - { path: /, pathType: Prefix }
            tls: []
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated: { prune: true, selfHeal: true }
