# Keycloak's own Postgres (T109, research R16), archived to the prod Garage under keycloak/ like the
# service databases. The password is the Terraform Secret pg-keycloak-app, so a restore still matches.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backups
spec:
  retentionPolicy: "14d"
  configuration:
    destinationPath: s3://backups/keycloak
    endpointURL: http://garage.sv-prod.svc.cluster.local:3900
    s3Credentials:
      accessKeyId: { name: s3-backups, key: ACCESS_KEY_ID }
      secretAccessKey: { name: s3-backups, key: ACCESS_SECRET_KEY }
    wal: { compression: gzip }
    data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
spec:
  instances: 1
  storage: { size: 2Gi }
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 384Mi }
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      secret: { name: pg-keycloak-app }
  postgresql:
    parameters:
      archive_timeout: "60s"
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: { barmanObjectName: backups }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: keycloak-db-daily
spec:
  schedule: "0 15 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster: { name: keycloak-db }
  method: plugin
  pluginConfiguration: { name: barman-cloud.cloudnative-pg.io }
